<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💪 健身打卡</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            background: #f8f9fa;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .stat-box {
            text-align: center;
        }
        .current { color: #e74c3c; }
        .max { color: #3498db; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            background: #2ecc71;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #27ae60;
        }
        #message {
            text-align: center;
            min-height: 24px;
            font-weight: bold;
            margin-top: 10px;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #3498db;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>💪 健身打卡</h1>

        <div class="stats">
            <div class="stat-box">
                <div>当前连续</div>
                <div class="current">{{ streak }} 天</div>
            </div>
            <div class="stat-box">
                <div>历史最高</div>
                <div class="max">{{ max_streak }} 天</div>
            </div>
        </div>

        <form id="logForm">
            <label>锻炼时长（分钟）</label>
            <input type="number" id="duration" min="1" required placeholder="例如：30">

            <label>备注（可选）</label>
            <input type="text" id="notes" maxlength="100" placeholder="跑步、深蹲、瑜伽...">

            <button type="submit">✅ 今日打卡</button>
        </form>

        <p id="message"></p>

        <div class="links">
            <a href="/history">📊 查看历史记录</a>
        </div>
    </div>

    <script>
        document.getElementById('logForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const duration = document.getElementById('duration').value;
            const notes = document.getElementById('notes').value;

            const res = await fetch('/api/log', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    duration: parseInt(duration), 
                    notes: notes || '' 
                })
            });
            const result = await res.json();

            const msgEl = document.getElementById('message');
            if (result.success) {
                msgEl.innerHTML = `<span style="color:green">${result.message}</span>`;
                setTimeout(() => location.reload(), 1500);
            } else {
                msgEl.innerHTML = `<span style="color:orange">${result.message}</span>`;
            }
        });
    </script>
</body>
</html>
